<!DOCTYPE html>
<head>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div id="header"></div>
  <script type = "module" src="../javaScript/loadHeader.js"></script>

  <div class="page">
    <h1> Checkout </h1>
    <div class="c-flex">
       <div class="c-details">
          <div class="c-section" >
            <h2>Your details</h2>
            <input class="c-info-box" id="c-first-name" type="text" placeholder="First name">
            <input class="c-info-box" id="c-last-name" type="text" placeholder="Last name">
            <input class="c-info-box" id="c-email" type="text" placeholder="Email">
            <input class="c-info-box" id="c-phone" type="text" placeholder="Phone Number">

          </div>
          <div class="c-section" >
            <h2>Collection details</h2>
            <p id="c-shop-address">12 Market Street, Bristol · usually ready within 2 hours</p>
            <h3 >Collection date</h3>
            <input type="date" id="c-collection-date">
            <h3>Collection time</h3>
            <div id="c-times">
              <button class="c-slot">11:00 – 1:00</button>
              <button class="c-slot">1:00 – 3:00</button>
              <button class="c-slot">3:00 – 5:00</button>
            </div>

          </div>
        </div>
      <div class="b-checkout-box">
            <h2>Order Summary</h2>
            <div class="b-costs">
              <p class="b-cost-type">Marshmallows</p>
              <p class="b-cost">£11.20</p>
              <p class="b-cost-type">Sugar Plums</p>
              <p class="b-cost">£2.50</p>
              <hr>
              <p class="b-total-text">Total</p>
              <p class="b-total-cost">£11.20</p>
              <p class="b-pay-note">click &amp; collect — pay in store on pickup</p>
            </div>
            <button>
              Checkout
            </button>
          </div>
      </div>
  </div>
  <script type = "module" src="../javaScript/loadHeader.js"></script>
</body>
