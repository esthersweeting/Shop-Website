<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="../css/main.css">
  </head>
  <body>
    <div id="header"></div>
    <script type = "module" src="../javaScript/loadHeader.js"></script>
    <div class="page">
      <h1>Your basket</h1>
      <div class="b-outer-container">
        <div class="b-products">
          <div class="b-product">
            <img src="../images/temp.jpg" alt="temp">
            <div class="b-product-info">
              <p class="b-product-name">Salted caramel fudge</p>
              <p class="b-unit-price">£3.50 each</p>
            </div>
            <input class="b-quantity" type="number" value="1">
            <p class="b-price">£7.00</p>
          </div>
          <div class="b-product">
            <img src="../images/temp.jpg" alt="temp">
            <div class="b-product-info">
              <p class="b-product-name">Rhubarb bonbons</p>
              <p class="b-unit-price">£4.20 each</p>
            </div>
            <input class="b-quantity" type="number" value="1">
            <p class="b-price">£4.20</p>
          </div>
        </div>
        <div class="b-checkout-box">
          <h2>Order Summary</h2>
          <div class="b-costs">
          <!--
          <p class="b-cost-type">Subtotal</p>
            <p class="b-cost">£11.20</p>
            <p class="b-cost-type">Delivery</p>
            <p class="b-cost">£2.50</p>
          -->
            <hr>
            <p class="b-total-text">Total</p>
            <p class="b-total-cost">£11.20</p>
            <p class="b-pay-note">click &amp; collect — pay in store on pickup</p>
          </div>
          <button id ="b-checkout-btn">
            Checkout
          </button>
        </div>
      </div>
            
      </div>
    </div> 
    <script  type = "module" src="../javaScript/basket.js"></script> 
  </body>
</html>
