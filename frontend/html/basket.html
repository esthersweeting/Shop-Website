<!DOCTYPE html>
<head></head>
<body>
  <h1>Your basket</h1>
  <div class="basket-box">
    <div class="basket-products">
      <div class="basket-product">
        <img src="../images/temp.jpg" alt="temp">
        <div class="bp-info">
          <p class="bp-name">Salted caramel fudge</p>
          <p class="bp-unit-price">£3.50 each</p>
        </div>
        <input class="bp-quantity" type="number" value="1">
        <p class="bp-price">£7.00</p>
      </div>
      <div class="basket-product">
        <img src="../images/temp.jpg" alt="temp">
        <div class="bp-info">
          <p class="bp-name">Rhubarb bonbons</p>
          <p class="bp-unit-price">£4.20 each</p>
        </div>
        <input class="bp-quantity" type="number" value="1">
        <p class="bp-price">£4.20</p>
      </div>
    </div>
    <div class="checkout-box">
      <h2>Order Summary</h2>
      <div class="costs">
        <p class="cost-type">Subtotal</p>
        <p class="cost">£11.20</p>
        <p class="cost-type">Delivery</p>
        <p class="cost">£2.50</p>
        <hr>
        <p class="total">Total</p>
        <p class="total-cost">£13.70</p>
      </div>
      <button>
        Checkout
      </button>
    </div>
  </div>
        
  </div>
    
</body>
